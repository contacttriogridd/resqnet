<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RESQNET — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; color: #101828; }
      main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      .banner { background: #fef3f2; border: 2px solid #b42318; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
      a.call { display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; margin: 8px 0; border-radius: 12px; background: #fff; border: 1px solid #d0d5dd; color: inherit; text-decoration: none; font-weight: 600; }
      a.call span:last-child { color: #b42318; font-size: 22px; }
      @media (prefers-color-scheme: dark) { body { background: #0c111d; color: #f5f5f6; } a.call { background: #161b26; border-color: #333741; } .banner { background: #2b0f0c; } }
    </style>
  </head>
  <body>
    <main>
      <div class="banner">
        <h1>You are offline</h1>
        <p>RESQNET could not load this page without a connection. Phone calls may still work.</p>
      </div>
      <a class="call" href="tel:112"><span>All emergencies</span><span>112</span></a>
      <a class="call" href="tel:108"><span>Ambulance</span><span>108</span></a>
      <a class="call" href="tel:101"><span>Fire &amp; Rescue</span><span>101</span></a>
      <a class="call" href="tel:100"><span>Police</span><span>100</span></a>
      <a class="call" href="tel:1078"><span>Disaster helpline</span><span>1078</span></a>
      <p><a href="/">Try opening RESQNET again</a></p>
    </main>
  </body>
</html>
