# RESQNET — full stack with Docker Compose.
#
#   cp .env.example .env      # set JWT secrets and SEED_ADMIN_PASSWORD
#   docker compose up --build
#   docker compose exec backend npx tsx backend/src/database/seed.ts   # first run only
#
# App: http://localhost:8080   (API is proxied at /api)
name: resqnet

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: resqnet
      POSTGRES_USER: ${POSTGRES_USER:-resqnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-resqnet} -d resqnet']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-resqnet}:${POSTGRES_PASSWORD:-change-me-in-production}@db:5432/resqnet?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
      CORS_ORIGINS: http://localhost:8080
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@resqnet.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      # nginx sits in front of the API: trust one proxy hop for client IPs (rate limiting).
      TRUST_PROXY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  pgdata:
